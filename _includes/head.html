<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="icon" sizes="32x32" href="{{ '/assets/img/favicon-32.png' | relative_url }}">
<link rel="icon" sizes="16x16" href="{{ '/assets/img/favicon-16.png' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/bulma.min.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/peekaboot.css' | relative_url }}">
<!-- Loaded synchronously and early on purpose: it sets [data-theme] before first paint. -->
<script src="{{ '/assets/site.js' | relative_url }}"></script>
