title: Peekaboot
tagline: Peekaboot lets you peek inside your Spring Boot application while it runs.
description: >-
  A Spring Boot starter that shows health, config, traces, queries and logs of
  your running application in a local dashboard and a dev toolbar.
url: https://www.peekaboot.org
baseurl: ""

# GitHub Pages defaults an unset theme to jekyll-theme-primer (a remote theme fetched
# at build time) and ships its assets/css/style.css alongside ours. This site supplies
# its own full Bulma-based theme, so the implicit default must be turned off explicitly.
theme: null

repository_url: https://github.com/peekaboot-org/peekaboot
maven_group: org.peekaboot
maven_artifact: peekaboot-spring-boot-starter
peekaboot_version: 0.1.0

# Part of the github-pages gem, but only active when listed: serves the old URLs of pages
# that were merged into others as a redirect (see `redirect_from` in their front matter).
plugins:
  - jekyll-redirect-from

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: "docs"
    values:
      layout: doc

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - serve.sh
  - vendor
