title: Peekaboot
description: Peekaboot lets you peek inside your Spring Boot application while it runs.
url: https://www.peekaboot.org
baseurl: ""

# GitHub Pages defaults an unset theme to jekyll-theme-primer (a remote theme fetched
# at build time) and ships its assets/css/style.css alongside ours. This site supplies
# its own full Bulma-based theme, so the implicit default must be turned off explicitly.
theme: null

repository_url: https://github.com/peekaboot-org/peekaboot
maven_group: org.peekaboot
maven_artifact: peekaboot-spring-boot-starter
peekaboot_version: 1.4.0
java_version: "25"
spring_boot_version: "4.1"

# Both ship with the github-pages gem and are active only when listed. jekyll-redirect-from
# serves the old URLs of pages that were merged into others as a redirect (see `redirect_from`
# in their front matter). jekyll-sitemap writes sitemap.xml, and robots.txt while the source
# has none.
plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: "docs"
    values:
      layout: doc

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - serve.sh
  - test
  - vendor
