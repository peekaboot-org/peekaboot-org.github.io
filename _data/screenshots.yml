# Alt text for each screenshot, keyed by its file name without the -light/-dark suffix.
# Say in one clause what each shot conveys, without counts or timings, which change with every recapture.
toolbar-collapsed: The collapsed dev toolbar at the bottom of an orders page, summarising the request
error-page: Peekaboot's error page for a failed request, with the exception, its message and a stack trace with framework frames folded
dashboard-overview: The Overview tab with stat tiles, a health banner and build, Git, Spring, Java and system cards
dashboard-insights: The Insights tab with live line charts of CPU usage and system load
dashboard-lifecycle: The Lifecycle tab, a table of application runs with start, stop, downtime and build
dashboard-traces: The Traces tab, a list of traces that can be filtered by root action type
dashboard-meters: The Meters tab, a filterable list of Micrometer meters
dashboard-environment: The Environment tab with a property source expanded and spring.datasource.password masked
dashboard-environment-revealed: The same view after Show secrets, with the password in clear text
dashboard-flyway: The Flyway tab, one row per migration
dashboard-liquibase: The Liquibase tab, one row per change set
dashboard-loggers: The Loggers tab, packages grouped and expandable, each logger with its effective level
dashboard-config: The Config tab with the spring.datasource group expanded and its password masked
dashboard-config-revealed: The same view after Show secrets, with the password in clear text
dashboard-scheduled-tasks: The Scheduled Tasks tab, grouped into cron, fixed delay and fixed rate tasks
trace-detail: The trace detail overlay for a GET /orders request, with a span tree and timing bars
trace-detail-queries: The Queries tab of a trace, listing its SQL statements with duration, row count and parameters
trace-detail-async: The Spans tab of a trace, with an async task span under the handler marked as background work
